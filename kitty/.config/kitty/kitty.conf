# ============================================================================
#  Kitty Terminal Configuration
#  ============================================================================
#  This is my personal kitty.conf, managed in a private dotfiles repo.
#  Active theme: Tokyo Night (see "Color Themes" section at the end for others).
#  To enable a different theme, comment out Tokyo Night and uncomment the one
#  you prefer.
#  ============================================================================

# ----------------------------------------------------------------------------
#  Font & Text
# ----------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Disable ligatures if you prefer (default: never)
# disable_ligatures never

# ----------------------------------------------------------------------------
#  Window Size & Placement
# ----------------------------------------------------------------------------
remember_window_size  yes
initial_window_width  640
initial_window_height 400

# Window padding (space between text and border)
window_padding_width 0
# single_window_padding_width -1   # Override when only one window is visible

# Window border width (0.5pt is default)
window_border_width 0.5pt
draw_minimal_borders yes          # Only draw borders between windows

# Placement strategy when cell size doesn't fit exactly
# placement_strategy center        # Uncomment to center the cell area

# ----------------------------------------------------------------------------
#  Cursor
# ----------------------------------------------------------------------------
# cursor #cccccc                   # Default cursor color
# cursor_text_color #111111        # Color of text under cursor
# cursor_shape block               # block | beam | underline
# cursor_beam_thickness 1.5
# cursor_underline_thickness 2.0
# cursor_blink_interval -1         # seconds; -1 = system default, 0 = no blink
# cursor_stop_blinking_after 15.0  # seconds of inactivity before stopping

cursor #c0caf5
cursor_text_color #1a1b26

# ----------------------------------------------------------------------------
#  Scrollback
# ----------------------------------------------------------------------------
# scrollback_lines 2000            # Number of lines to keep in memory
# scrollback_indicator_opacity 1.0
# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
# scrollback_pager_history_size 0  # Separate history for pager (MB)
# scrollback_fill_enlarged_window no
# wheel_scroll_multiplier 5.0
# wheel_scroll_min_lines 1
# touch_scroll_multiplier 1.0

# ----------------------------------------------------------------------------
#  Mouse
# ----------------------------------------------------------------------------
# mouse_hide_wait 3.0              # Hide cursor after inactivity (seconds)
# url_color #0087bd
# url_style curly                  # none | straight | double | curly | dotted | dashed
# open_url_with default
# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
# detect_urls yes
# url_excluded_characters
# show_hyperlink_targets no
# underline_hyperlinks hover      # hover | always | never
# copy_on_select no               # clipboard | a1 | etc.
# paste_actions quote-urls-at-prompt,confirm
# strip_trailing_spaces never     # never | smart | always
# select_by_word_characters @-./_~?&=%+#
# select_by_word_characters_forward
# click_interval -1.0
# focus_follows_mouse no
# pointer_shape_when_grabbed arrow
# default_pointer_shape beam
# pointer_shape_when_dragging beam

url_color #9ece6a

# ----------------------------------------------------------------------------
#  Performance
# ----------------------------------------------------------------------------
# repaint_delay 10                 # milliseconds between screen updates
# input_delay 3                    # milliseconds before processing input
# sync_to_monitor yes              # Prevent tearing; may add latency

# ----------------------------------------------------------------------------
#  Terminal Bell
# ----------------------------------------------------------------------------
# enable_audio_bell yes
# visual_bell_duration 0.0         # seconds to flash the screen
# visual_bell_color none
# window_alert_on_bell yes
# bell_on_tab "🔔 "
# command_on_bell none
# bell_path none
# linux_bell_theme __custom

# ----------------------------------------------------------------------------
#  Window Layout & Borders
# ----------------------------------------------------------------------------
enabled_layouts all
# window_resize_step_cells 2
# window_resize_step_lines 2
# window_margin_width 0            # Margin outside the border (pts)
# single_window_margin_width -1    # Override when only one window
# placement_strategy center        # center | top-left
# active_border_color #00ff00
# inactive_border_color #cccccc
# bell_border_color #ff5a00
# inactive_text_alpha 1.0          # Fade text in inactive windows (0-1)
# hide_window_decorations no       # yes | titlebar-only | titlebar-and-corners
# window_logo_path none
# window_logo_position bottom-right
# window_logo_alpha 0.5
# resize_debounce_time 0.1 0.5
# resize_in_steps no
# visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
# confirm_os_window_close -1

active_border_color   #3d59a1
inactive_border_color #101014
bell_border_color     #e0af68

# ----------------------------------------------------------------------------
#  Tab Bar
# ----------------------------------------------------------------------------
tab_bar_edge bottom
# tab_bar_margin_width 0.0
# tab_bar_margin_height 0.0 0.0
tab_bar_style fade
# tab_bar_align left
# tab_bar_min_tabs 2
# tab_switch_strategy previous
tab_fade 1.0
# tab_separator " ┇"
# tab_powerline_style angled
# tab_activity_symbol none
# tab_title_max_length 0
# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
# active_tab_title_template none

active_tab_foreground   #3d59a1
active_tab_background   #16161e
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #16161e
inactive_tab_font_style bold
tab_bar_background      #101014

# ----------------------------------------------------------------------------
#  Opacity & Blur
# ----------------------------------------------------------------------------
background_opacity 0.95
background_blur 99

# Other background options (commented)
# background_image none
# background_image_layout tiled
# background_image_linear no
# dynamic_background_opacity no
# background_tint 0.0
# background_tint_gaps 1.0
# dim_opacity 0.4

# ----------------------------------------------------------------------------
#  OS Specific Tweaks
# ----------------------------------------------------------------------------
# wayland_titlebar_color system
macos_titlebar_color #16161e
# macos_option_as_alt no
# macos_hide_from_tasks no
# macos_quit_when_last_window_closed no
# macos_window_resizable yes
# macos_thicken_font 0
# macos_traditional_fullscreen no
# macos_show_window_title_in all
# macos_menubar_title_max_length 0
# macos_custom_beam_cursor no
# macos_colorspace srgb
# linux_display_server auto
# wayland_enable_ime yes

# ----------------------------------------------------------------------------
#  Advanced
# ----------------------------------------------------------------------------
# shell .
# editor .
# close_on_child_death no
# remote_control_password
# allow_remote_control no
# listen_on none
# env
# watcher
# exe_search_path
# update_check_interval 24
# startup_session none
# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
# clipboard_max_size 512
# file_transfer_confirmation_bypass
# allow_hyperlinks yes
# shell_integration enabled
# allow_cloning ask
# clone_source_strategies venv,conda,env_var,path
# notify_on_cmd_finish never
# term xterm-kitty
# terminfo_type path
# forward_stdio no
# menu_map

# ----------------------------------------------------------------------------
#  Keyboard Shortcuts
# ----------------------------------------------------------------------------
# kitty_mod ctrl+shift
# clear_all_shortcuts no
# action_alias
# kitten_alias

