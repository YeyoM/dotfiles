#################################
#            PICOM              #
#   Compositor for X11          #
#   https://github.com/yshui/picom
#################################

# ============================================================================
#  SHADOWS
# ============================================================================

# Enable client-side shadows on windows.
# Desktop windows (_NET_WM_WINDOW_TYPE_DESKTOP) never get shadow unless explicitly requested.
shadow = false;

# Blur radius for shadows (in pixels). Default: 12
shadow-radius = 7;

# Opacity of shadows (0.0–1.0). Default: 0.75
# shadow-opacity = .75

# Horizontal offset of shadows (in pixels). Default: -15
shadow-offset-x = -7;

# Vertical offset of shadows (in pixels). Default: -15
shadow-offset-y = -7;

# Custom shadow color (overrides shadow-red/green/blue). Default: #000000
# shadow-color = "#000000"

# Conditions of windows that should have **no** shadow.
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@"
];

# Conditions of windows that should have no shadow painted **over** them (e.g., docks).
# clip-shadow-above = []

# Crop shadow to the window's monitor (requires X RandR).
# crop-shadow-to-monitor = false


# ============================================================================
#  FADING
# ============================================================================

# Fade windows in/out when opening/closing and when opacity changes.
fading = true;

# Opacity change per step while fading in (0.01–1.0). Default: 0.028
fade-in-step = 0.03;

# Opacity change per step while fading out (0.01–1.0). Default: 0.03
fade-out-step = 0.03;

# Time between steps (in milliseconds). Default: 10
# fade-delta = 10

# Conditions of windows that should **not** be faded.
# fade-exclude = []

# Disable fading on window open/close.
# no-fading-openclose = false

# Disable fading for destroyed ARGB windows with WM frame (workaround for bugs in some WMs).
# no-fading-destroyed-argb = false


# ============================================================================
#  TRANSPARENCY & OPACITY
# ============================================================================

# Opacity of inactive windows (0.1–1.0). Default: 1.0
inactive-opacity = 1;

# Opacity of window titlebars and borders. Default: 1.0
frame-opacity = 0.7;

# Enable frame opacity for colors that match the frame (use with caution).
# frame-opacity-for-same-colors = true;
# Tolerance for similar colors (0 exact, 1 all). Default: 0.5
# frame-opacity-for-same-colors-tolerance = 0.5;
# Multiplier to make different colors opaque. Default: 5
# frame-opacity-for-same-colors-multiplier = 5;

# Let inactive opacity override _NET_WM_WINDOW_OPACITY values.
inactive-opacity-override = false;

# Default opacity for active windows (0.0–1.0). Default: 1.0
# active-opacity = 1.0

# Dim inactive windows (0.0–1.0, 0 = no dim). Default: 0.0
inactive-dim = 0.1;

# Conditions of windows that should never be considered focused.
focus-exclude = [ "class_g = 'Cairo-clock'" ];

# Use fixed inactive dim value instead of adjusting according to window opacity.
# inactive-dim-fixed = 1.0

# Opacity rules (format: "PERCENT:PATTERN"). Example: "80:class_g = 'URxvt'"
# opacity-rule = []


# ============================================================================
#  CORNERS
# ============================================================================

# Radius of rounded window corners (0 = disabled). Does not work well with transparent-clipping.
corner-radius = 0;

# Exclude conditions for rounded corners.
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];


# ============================================================================
#  BACKGROUND BLUR
# ============================================================================

# Blur method: box, dual_kawase, gaussian, kernel, none
# blur-method = dual_kawase
# blur-size = 12
# blur-deviation = false
# blur-strength = 5

# Blur background of semi-transparent / ARGB windows (performance heavy).
# blur-background = false

# Blur background when window frame is not opaque (implies blur-background).
# blur-background-frame = false

# Use fixed blur strength rather than adjusting to window opacity.
# blur-background-fixed = false

# Custom blur convolution kernel (e.g., "5,5,1,1,...").
blur-kern = "3x3box";

# Exclude conditions for background blur.
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];


# ============================================================================
#  GENERAL SETTINGS
# ============================================================================

# Enable D-Bus remote control.
# dbus = true

# Daemonize after initialization (may cause issues with some drivers).
# daemon = false

# Rendering backend: xrender, glx, egl, or xr_glx_hybrid. Default: xrender
backend = "xrender";

# Use higher precision and dither to reduce banding (OpenGL only).
dithered-present = false;

# Enable VSync.
vsync = true;

# Try to detect WM windows and mark them as focused.
mark-wmwin-focused = true;

# Mark override-redirect windows (like panels) as focused if they have WM_STATE.
mark-ovredir-focused = true;

# Detect rounded corners to avoid treating them as shaped windows.
detect-rounded-corners = true;

# Detect _NET_WM_WINDOW_OPACITY on client windows (useful if WM doesn't pass it to frame).
detect-client-opacity = true;

# Use EWMH _NET_ACTIVE_WINDOW to determine focus (may be more accurate).
# use-ewmh-active-win = false

# Unredirect full‑screen opaque windows for performance (may cause flicker).
# unredir-if-possible = false
# Delay before unredirecting (milliseconds). Default: 0
# unredir-if-possible-delay = 0
# Conditions to exclude from unredirection.
# unredir-if-possible-exclude = []

# Use WM_TRANSIENT_FOR to group windows and consider them focused together.
detect-transient = true;

# Use WM_CLIENT_LEADER for grouping (lower priority than transient).
# detect-client-leader = false

# Resize damaged region by this many pixels (helps with blur line artifacts).
# resize-damage = 1

# Invert colors of certain windows (resource‑hogging).
# invert-color-include = []

# GLX: Avoid stencil buffer (may improve performance but may break blur).
# glx-no-stencil = false

# GLX: Avoid rebinding pixmap on damage (may improve performance but may break things).
# glx-no-rebind-pixmap = false

# Use damage information to redraw only changed areas.
use-damage = true;

# Use X Sync fence to sync draw calls (needed on some NVIDIA setups).
# xrender-sync-fence = false

# GLX: Custom fragment shader for window contents.
# window-shader-fg = "default"
# Per-window shader rules (SHADER_PATH:PATTERN).
# window-shader-fg-rule = [ "my_shader.frag:window_type != 'dock'" ]

# Force all windows to be painted with blending (for shaders that make pixels transparent).
# force-win-blend = false

# Disable EWMH for fullscreen detection (fall back to size/position).
# no-ewmh-fullscreen = false

# Cap brightness of windows (1.0 = disabled). Requires use-damage=false.
# max-brightness = 1.0

# Make transparent windows clip others instead of blending on top.
# transparent-clipping = false
# Exclude conditions for transparent clipping.
# transparent-clipping-exclude = []

# Log level: trace, debug, info, warn, error. Default: warn
log-level = "warn";

# Log file (absolute path recommended). Default: stderr
# log-file = "/path/to/log"

# Show all X errors (debugging).
# show-all-xerrors = false

# Write process ID to a file.
# write-pid-path = "/path/to/pid"

# ----------------------------------------------------------------------------
#  Window Type Overrides
# ----------------------------------------------------------------------------
# Per‑window‑type settings: fade, shadow, opacity, focus, full-shadow, clip-shadow-above, redir-ignore.
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.8; }
  dropdown_menu = { opacity = 0.8; }
};


# ============================================================================
#  ANIMATIONS
# ============================================================================
# These define smooth transitions for window open/close, show/hide, and workspace switching.
# You can modify timing, scaling, opacity, offset, etc. to customize the feel.

animations = ({
    triggers = ["close", "hide"];
    opacity = {
        timing = "0.2s linear";
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    blur-opacity = "0";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
        timing = "0.2s cubic-bezier(0.21, 0.02, 0.76, 0.36)";
        start = 1;
        end = 1.04;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
},
{
    triggers = ["open", "show"];
    opacity = {
        timing = "0.2s linear";
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    blur-opacity = {
        timing = "0.1s linear 0.2s";
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
        timing = "0.2s cubic-bezier(0.24, 0.64, 0.79, 0.98)";
        start = 1.04;
        end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
},

# Half Monitor Size Desktop Switching
{
    triggers = ["workspace-out"];
    offset-y = {
        timing = "0.2s cubic-bezier(0.21, 0.02, 0.76, 0.36)";
        start = "0";
        end = "-window-height / 2";
    };
    shadow-offset-y = "offset-y";
    opacity = {
        timing = "0.2s linear";
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    blur-opacity = "0";
    shadow-opacity = "opacity";
},
{
    triggers = ["workspace-out-inverse"];
    offset-y = {
        timing = "0.2s cubic-bezier(0.21, 0.02, 0.76, 0.36)";
        start = "0";
        end = "window-height / 2";
    };
    shadow-offset-y = "offset-y";
    opacity = {
        timing = "0.2s linear";
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    blur-opacity = "0";
    shadow-opacity = "opacity";
},
{
    triggers = ["workspace-in"];
    offset-y = {
        timing = "0.2s cubic-bezier(0.24, 0.64, 0.79, 0.98)";
        start = "window-height / 2";
        end = "0";
    };
    shadow-offset-y = "offset-y";
    opacity = {
        timing = "0.2s linear";
        start = "0";
        end = "window-raw-opacity";
    };
    blur-opacity = {
        timing = "0.1s linear 0.2s";
        start = "0";
        end = "window-raw-opacity";
    };
    shadow-opacity = "opacity";
},
{
    triggers = ["workspace-in-inverse"];
    offset-y = {
        timing = "0.2s cubic-bezier(0.24, 0.64, 0.79, 0.98)";
        start = "- window-height / 2";
        end = "0";
    };
    shadow-offset-y = "offset-y";
    opacity = {
        timing = "0.2s linear";
        start = "0";
        end = "window-raw-opacity";
    };
    blur-opacity = {
        timing = "0.1s linear 0.2s";
        start = "0";
        end = "window-raw-opacity";
    };
    shadow-opacity = "opacity";
}

