# ============================================================
# Terminal
# ============================================================

#set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"

# True color support
set -ga terminal-overrides ",xterm*:Tc"


# ============================================================
# TPM / Plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


# ============================================================
# Prefix
# ============================================================

# Preserve prefix from the first config
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ============================================================
# General
# ============================================================

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# ============================================================
# Window Navigation
# ============================================================

# Move between windows with Alt-1, Alt-2, etc.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10


# ============================================================
# Copy Mode
# ============================================================

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# ============================================================
# Resurrect
# ============================================================

# Custom resurrect key bindings from the second config
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-r'


# ============================================================
# Theme - Powerkit
# ============================================================

# PowerKit plugin
set -g @plugin 'fabioluciano/tmux-powerkit'

# Basic configuration
set -g @powerkit_plugins "git,kubernetes"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"

# Separators styles
set -g @powerkit_separator_style "slantup"
set -g @powerkit_edge_separator_style "slantup"

set -g @powerkit_elements_spacing "true"

set -g @powerkit_icon_padding "3"

set -g @powerkit_status_position "bottom"

# ============================================================
# Pane Splitting
# ============================================================

# Preserve split bindings from the first config
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'


# ============================================================
# LazyGit
# ============================================================

# Preserve LazyGit popup binding from the first config
bind g popup -d '#{pane_current_path}' -E -w 90% -h 90% lazygit


# ============================================================
# TPM
# ============================================================

run '~/.tmux/plugins/tpm/tpm'

